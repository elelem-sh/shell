name: Install

on:
  push:
    branches: [main]
    paths: [install, bin/without-compilers, bin/nonce-chat, .github/workflows/install.yml]
  schedule:
    - cron: "41 9 * * 1"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - id: models
        run: echo "key=$(grep -E 'model_sha256=' install | shasum -a 256 | cut -c 1-16)" >>"$GITHUB_OUTPUT"

      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.agents/models
          key: models-${{ runner.os }}-${{ runner.arch }}-${{ steps.models.outputs.key }}

      - name: Install
        run: bin/without-compilers sh install </dev/null

      - name: Chat
        timeout-minutes: 20
        run: bin/nonce-chat

      - name: Run
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          elelem-shell --help >/dev/null
          elelem-shell -p demo "echo ok" </dev/null | grep "exit 0"
          ELELEM_GGUF_MODEL=/x elelem-shell --help | grep "default: llama"

      - name: Install again
        run: bin/without-compilers sh install </dev/null

      - name: Run after upgrade
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          elelem-shell -p demo "echo ok" </dev/null | grep "exit 0"
          ELELEM_GGUF_MODEL=/x elelem-shell --help | grep "default: llama"

  alpine:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - id: models
        run: echo "key=$(grep -E 'model_sha256=' install | shasum -a 256 | cut -c 1-16)" >>"$GITHUB_OUTPUT"

      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.agents/models
          key: models-alpine-${{ steps.models.outputs.key }}

      - name: Install, run and chat without bash or a compiler
        run: |
          mkdir -p ~/.agents/models
          docker run --rm -i -v "$PWD/install:/install:ro" -v "$PWD/bin/nonce-chat:/nonce-chat:ro" \
            -v "$HOME/.agents/models:/root/.agents/models" alpine:3 sh -euc '
            apk add -q curl xz
            sh /install
            export PATH="$HOME/.local/bin:$PATH"
            elelem-shell --help >/dev/null
            elelem-shell -p demo "echo ok" | grep "exit 0"
            ELELEM_GGUF_MODEL=/x elelem-shell --help | grep "default: llama"
            sh /nonce-chat
          ' </dev/null
