name: Install

on:
  push:
    branches: [main]
    paths: [install, bin/without-compilers, bin/nonce-chat, bin/seed-old-model, bin/check-model, .github/workflows/install.yml]
  schedule:
    - cron: "41 9 * * 1"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.agents/models
          key: models-v2-${{ runner.os }}-${{ runner.arch }}

      - name: Seed an older install
        run: bin/seed-old-model

      - name: Install
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ELELEM_LOCAL: 1
        run: bin/without-compilers sh install </dev/null

      - name: Check the model
        run: bin/check-model

      - name: Chat
        timeout-minutes: 20
        env:
          ANTHROPIC_API_KEY: unused
        run: bin/nonce-chat

      - name: Run
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          elelem-shell --help >/dev/null
          elelem-shell -p demo "echo ok" </dev/null | grep "exit 0"
          ELELEM_GGUF_MODEL=/x elelem-shell hi </dev/null 2>&1 | grep "loading x"

      - name: Install again
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ELELEM_LOCAL: 1
        run: bin/without-compilers sh install </dev/null

      - name: Run after upgrade
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          elelem-shell -p demo "echo ok" </dev/null | grep "exit 0"
          ELELEM_GGUF_MODEL=/x elelem-shell hi </dev/null 2>&1 | grep "loading x"

  alpine:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.agents/models
          key: models-v2-alpine

      - name: Install, run and chat without bash or a compiler
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bin/seed-old-model
          docker run --rm -i -e GITHUB_TOKEN -e ELELEM_LOCAL=1 -v "$PWD/install:/install:ro" \
            -v "$PWD/bin/nonce-chat:/nonce-chat:ro" -v "$PWD/bin/check-model:/check-model:ro" \
            -v "$HOME/.agents/models:/root/.agents/models" alpine:3 sh -euc '
            apk add -q curl xz
            sh /install
            sh /check-model
            export PATH="$HOME/.local/bin:$PATH"
            elelem-shell --help >/dev/null
            elelem-shell -p demo "echo ok" | grep "exit 0"
            ELELEM_GGUF_MODEL=/x elelem-shell hi </dev/null 2>&1 | grep "loading x"
            sh /nonce-chat
          ' </dev/null
